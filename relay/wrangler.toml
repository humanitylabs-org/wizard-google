# Deployed route-only on www.aiwizards.com/wizard-google/auth/*. Secrets: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (wrangler secret put).
name = "wizard-google-auth"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "www.aiwizards.com/wizard-google/auth/*", zone_name = "aiwizards.com" }]
[observability]
enabled = false
[observability.logs]
enabled = false
invocation_logs = false
