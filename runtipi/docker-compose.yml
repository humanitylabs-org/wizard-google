# Google: one app, one container. Your Google client, the encrypted sign-ins, the store key and every grant
# live in ${APP_DATA_DIR}/data: a bind mount, so App Manager backups and box moves carry them.
# No named volumes (backups skip those). The page, apps and agents never receive a Google token.
services:
  wizard-google:
    # Built and pushed by .github/workflows/image.yml (amd64 + arm64) from commit 4c35283; source: app/Dockerfile.
    image: ghcr.io/humanitylabs-org/wizard-google:sha-f6dd4db05d3ebb626b9191ca5a350b5c7d0b1308@sha256:295f51b8607980478d30bb47a78fbbe157eed591ba5eafe36f848f474a8d7bf7
    # A fresh App Manager data bind is root-owned; retain the sandbox below.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    tmpfs: ["/tmp:rw,nosuid,size=64m,uid=1000,gid=1000"]
    environment:
      PORT: "18812"
      DATA_DIR: /data
      # Optional stateless return page for boxes without their own https address (see relay/).
      GOOGLE_RELAY_CALLBACK: ${GOOGLE_RELAY_CALLBACK:-}
      # Wizard's Google app (quick sign-in): the stateless sign-in service in relay/. Empty = own Google client only.
      GOOGLE_SIGNIN_SERVICE: ${GOOGLE_SIGNIN_SERVICE:-https://www.aiwizards.com/wizard-google/auth}
      # Inside the Wizard shell, Tailscale Serve names the signed-in tailnet user; only these logins own the page.
      WIZARD_SHELL_AUTH: ${WIZARD_SHELL_AUTH:-tailscale-serve}
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
      WIZARD_SHELL_PATH: ${WIZARD_SHELL_PATH:-/wizard-google/}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_OWNER_TOKEN: ${WIZARD_OWNER_TOKEN:-}
      WIZARD_ADMIN_TOKEN: ${WIZARD_ADMIN_TOKEN:-}
      WIZARD_MCP_BOX_ONLY: ${WIZARD_MCP_BOX_ONLY:-true}
      WIZARD_FRAME_ANCESTORS: ${WIZARD_FRAME_ANCESTORS:-'self'}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 18812
x-runtipi:
  schema_version: 2
  overrides: []
